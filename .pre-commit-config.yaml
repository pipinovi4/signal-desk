# Activate the project environment and install .[dev] before running hooks.
# Local Python hooks use the same pinned tools and dependencies as CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: mypy .
        language: system
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false

      - id: frontend-tests
        name: frontend tests
        entry: bash -c 'cd frontend && npm run test:run'
        language: system
        pass_filenames: false
