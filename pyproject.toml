[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk"
version = "0.1.0"
description = "A notification hub with optional AI enrichment and Telegram delivery."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
# Shared runtime dependencies for the Python services.
dependencies = [
    # Backend API and ASGI server
    "fastapi>=0.141.1,<0.142",
    "uvicorn>=0.52.4,<0.53",
    # Telegram bot
    "aiogram>=3.31.0,<4",
    # Async ORM and PostgreSQL driver
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg>=0.31.0,<0.32",
    # Shared validation; keep compatible with aiogram
    "pydantic>=2.13.5,<2.14",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
ai_worker = "ai-worker/ai_worker"

[tool.setuptools.packages.find]
where = [".", "ai-worker"]
include = ["backend", "backend.*", "bot", "bot.*", "ai_worker", "ai_worker.*"]
exclude = ["backend.tests", "backend.tests.*", "bot.tests", "bot.tests.*"]
namespaces = false
