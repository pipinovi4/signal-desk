[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldesk"
version = "0.1.0"
description = "A notification hub with optional AI enrichment and Telegram delivery."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
# Shared runtime dependencies for the Python services.
dependencies = [
  # Backend API and ASGI server
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.52.4,<0.53",
  # Telegram bot
  "aiogram>=3.31.0,<4",
  # Async ORM and PostgreSQL driver
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "asyncpg>=0.31.0,<0.32",
  # Shared validation and settings management; keep compatible with aiogram
  "pydantic>=2.13.5,<2.14",
  "pydantic-settings>=2.10,<3",
  "alembic>=1.16,<2",
  "uuid6>=2025.0.1,<2026",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.7",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pre-commit==4.6.2",
  "watchfiles==1.1.1",
  "pwdlib[argon2]>=0.3,<1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
ai_worker = "ai-worker/ai_worker"

[tool.setuptools.packages.find]
where = [".", "ai-worker"]
include = ["backend", "backend.*", "bot", "bot.*", "ai_worker", "ai_worker.*"]
exclude = ["backend.tests", "backend.tests.*", "bot.tests", "bot.tests.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "ai-worker"]
extend-exclude = [
  ".git", ".venv", "venv", "__pycache__", ".mypy_cache",
  ".pytest_cache", ".ruff_cache", "build", "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "bot", "ai_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/backend",
  "$MYPY_CONFIG_FILE_DIR/ai-worker",
]
explicit_package_bases = true
exclude = [
  '(^|/)(\.git|\.venv|venv|__pycache__|\.mypy_cache|\.pytest_cache|\.ruff_cache|build|dist|node_modules|[^/]+\.egg-info)(/|$)',
  '(^|/)(backend/tests|bot/tests|ai-worker/tests|rabbitmq/tests)(/|$)',
]
[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["backend/tests", "bot/tests", "ai-worker/tests", "rabbitmq/tests"]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]
